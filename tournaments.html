<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AITU Esports Hub - Tournaments</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🎮 AITU Esports Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-menu navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="teams.html">Teams & Players</a></li>
          <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Registration</a></li>
        </ul>
        <button id="themeToggleBtn" class="btn btn-outline-light btn-sm">🌙 Dark Mode</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h1 class="mb-4">Esports Tournaments</h1>

    <!-- Filter & Search Section -->
    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <input type="text" id="searchInput" class="form-control" placeholder="Search tournament by title or game...">
      </div>
      <div class="col-md-4">
        <select id="gameFilter" class="form-select">
          <option value="All">All Games</option>
          <option value="CS2">Counter-Strike 2</option>
          <option value="Dota 2">Dota 2</option>
          <option value="Valorant">Valorant</option>
          <option value="FC 24">FC 24</option>
        </select>
      </div>
      <div class="col-md-2">
        <button id="resetFiltersBtn" class="btn btn-secondary w-100">Reset</button>
      </div>
    </div>

    <!-- Dynamic Tournament Cards Grid -->
    <div class="row" id="tournamentsGrid"></div>

    <!-- Favorites Section -->
    <div class="mt-5 p-4 border rounded bg-light">
      <h3>⭐ Favorite Tournaments (<span id="favCount">0</span>)</h3>
      <ul id="favoritesList" class="list-group mt-3">
        <li class="list-group-item text-muted">No favorite tournaments added yet.</li>
      </ul>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2026 AITU Esports Hub.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/tournaments.js"></script>
  <script src="js/jquery-effects.js"></script>
</body>
</html>
