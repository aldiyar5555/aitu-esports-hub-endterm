<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AITU Esports Hub - Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">🎮 AITU Esports Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-menu navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
          <li class="nav-item"><a class="nav-link" href="teams.html">Teams & Players</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="register.html">Registration</a></li>
        </ul>
        <button id="themeToggleBtn" class="btn btn-outline-light btn-sm">🌙 Dark Mode</button>
      </div>
    </div>
  </nav>

  <div class="container my-5">
    <h1 class="mb-4">Event Gallery & Moments</h1>

    <!-- Tab Filter -->
    <ul class="nav nav-pills mb-4" id="galleryTabs">
      <li class="nav-item">
        <button class="nav-link active gallery-tab-btn" data-category="all">All Photos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link gallery-tab-btn" data-category="cs2">CS2 Arena</button>
      </li>
      <li class="nav-item">
        <button class="nav-link gallery-tab-btn" data-category="dota">Dota 2 Finals</button>
      </li>
      <li class="nav-item">
        <button class="nav-link gallery-tab-btn" data-category="awards">Awards Ceremony</button>
      </li>
    </ul>

    <!-- Gallery Grid -->
    <div class="row g-4" id="galleryContainer"></div>

    <!-- Modal for Preview -->
    <div class="modal fade" id="imageModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body p-0">
            <img id="modalImage" src="" class="img-fluid w-100" alt="Expanded view">
          </div>
          <div class="modal-footer">
            <span id="modalCaption" class="fw-bold me-auto"></span>
            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2026 AITU Esports Hub.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/jquery-effects.js"></script>
</body>
</html>
